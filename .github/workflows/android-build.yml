
name: Build ArbiScan APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Extract project ZIP
        run: |
          unzip ArbiScanAndroid_Project.zip
          cd ArbiScanAndroid

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd ArbiScanAndroid
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ArbiScan-debug-apk
          path: ArbiScanAndroid/app/build/outputs/apk/debug/app-debug.apk
